<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Jeopardy</title>
    <link
      href="https://fonts.googleapis.com/css?family=Copse&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="jeopardy.css" />
  </head>
  <body>
    <header>
      <h1>Jeopardy</h1>
    </header>

    <main>
      <div>
        <button id="restart" type="button">Start game</button>
        <span id="loading" aria-live="polite" style="display: none"
          >Loading...</span
        >
      </div>
      <table id="jeopardy" role="grid" aria-label="Jeopardy game board">
        <thead></thead>
        <tbody></tbody>
      </table>
    </main>
    <script src="https://unpkg.com/jquery"></script>
    <script src="https://unpkg.com/axios/dist/axios.js"></script>
    <script src="https://unpkg.com/lodash"></script>
    <script src="jeopardy.js"></script>
  </body>
</html>
